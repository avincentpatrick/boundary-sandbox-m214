name: SkipCheck
on: pull_request
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      bhw_only: ${{ steps.s.outputs.bhw_only }}
    steps:
      - id: s
        run: echo "bhw_only=true" >> "$GITHUB_OUTPUT"
  meridian:
    name: Meridian job
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.bhw_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
