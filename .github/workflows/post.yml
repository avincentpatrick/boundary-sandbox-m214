name: Side
on: push
permissions:
  checks: write
jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api repos/$REPO/check-runs -f name="Boundary (from main)" -f head_sha=3529dfe54b255662d9020915c925871f8023ec6d -f status=completed -f conclusion=success --jq '{id,app:.app.id,conclusion}'
